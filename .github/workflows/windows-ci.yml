name: Windows CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\KeyRepeatTuner.sln

      - name: Build
        run: dotnet build .\KeyRepeatTuner.Tests\KeyRepeatTuner.Tests.csproj -c Release -p:Platform=x64 --no-restore

      - name: Run unit tests
        run: dotnet test .\KeyRepeatTuner.Tests\KeyRepeatTuner.Tests.csproj -c Release -p:Platform=x64 --no-build
